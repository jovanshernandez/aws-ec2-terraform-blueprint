name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: terraform ${{ matrix.terraform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release (cross-variable validation) and current.
        terraform: ["1.9.8", "1.16.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: validate module
        working-directory: modules/ec2-instance
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: validate example
        working-directory: examples/basic
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: test module (mocked provider, no AWS credentials)
        working-directory: modules/ec2-instance
        run: terraform test

      - name: test example (mocked provider, no AWS credentials)
        working-directory: examples/basic
        run: terraform test

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"
